[package]
name = "ai_simulation"
version = "0.1.0"
edition = "2021"
description = "A simulation of AI entities with different behaviors and interactions"
repository = "https://github.com/yourusername/ai-simulation"
license = "MIT OR Apache-2.0"
keywords = ["simulation", "ai", "bevy", "game"]
categories = ["simulation", "game-engines"]

[dependencies]
# Bevy game engine
bevy = { version = "0.10", default-features = false }

# UI
bevy_egui = "0.20"

# Random number generation
rand = "0.8.5"

# Unique identifiers
uuid = { version = "1.3.0", features = ["v4", "serde"] }

# Parallel processing
rayon = "1.8.0"

# Efficient synchronization primitives
parking_lot = "0.12.1"

# Logging
log = "0.4"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"

# Error handling
anyhow = "1.0.66"
thiserror = "1.0.37"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.86"

bevy-inspector-egui = "0.18.0"

# ECS utilities
bevy_ecs_tilemap = "0.9.0"
bevy_rapier2d = { version = "0.21.0", features = ["simd-stable"] }

[features]
default = []
gizmos = []
egui = []

[dev-dependencies]
# Testing utilities
assert_matches = "1.5"
rstest = "0.16"